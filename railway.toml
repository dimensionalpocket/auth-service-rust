[build]
builder = "dockerfile"
# watchPatterns = ["!**/*.md"]

[deploy]
startCommand = "./dp-auth-service"
preDeployCommand = "./migrate_and_dump"
healthcheckPath = "/health"
healthcheckTimeout = 30
sleepApplication = false
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
numReplicas = 1
