[package]
name = "dp-auth-service"
version = "0.0.0"
edition = "2021"
default-run = "dp-auth-service"

[dependencies]
async-graphql = "7.0"
async-graphql-axum = "7.0"
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4"] }
regex = "1.11.1"
once_cell = "1.21.3"
argon2 = "0.5"
bcrypt = "0.15"
rand = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.0"
aes-gcm = "0.10"
base64 = "0.22"
dp-auth-session-service = { git = "https://github.com/dimensionalpocket/auth-session-service", tag = "0.1.0" }

[features]
default = ["test-utils"]
test-utils = []

[dev-dependencies]
tracing-test = "0.2"

[[bin]]
name = "migrate_and_dump"
path = "config/scripts/migrate_and_dump.rs"
