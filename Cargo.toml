[package]
name = "dps-auth-api"
version = "0.1.0"
edition = "2021"
authors = ["Dimensional Pocket <dpauth@dimensionalpocket.com>"]

[dependencies]
async-graphql = "7.0"
async-graphql-axum = "7.0"
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4"] }
regex = "1.11.1"
once_cell = "1.21.3"
argon2 = "0.5"
bcrypt = "0.15"
rand = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.0"
aes-gcm = "0.10"
base64 = "0.22"
dps-auth-session = { git = "https://github.com/dimensionalpocket/dps-auth-session-rs", tag = "0.2.0" }
dps-config = { git = "https://github.com/dimensionalpocket/dps-config-rs", tag = "0.3.0" }
clap = { version = "4.0", features = ["derive", "env"] }

[features]
default = ["test-utils"]
test-utils = []

[dev-dependencies]
tracing-test = "0.2"

# Local development script
[[bin]]
name = "run_local_server"
path = "scripts/run_local_server.rs"

# Database migration and setup tool
[[bin]]
name = "dps-auth-api-migrate"
path = "config/scripts/dps_auth_api_migrate.rs"
