name: Docker Build Test

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: dp-auth-service:test
        # Use GitHub Actions cache with better configuration
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Build arguments for better caching
        build-args: |
          BUILDKIT_INLINE_CACHE=1
        # Use buildx features for better performance
        platforms: linux/amd64
        
    - name: Test image exists
      run: docker images dp-auth-service:test